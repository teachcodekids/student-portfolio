<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>แฟ้มสะสมผลงานนักเรียน</title><meta name="description" content="แฟ้มสะสมผลงาน Scratch, Python, 3D, micro:bit และ MakeCode Arcade"><link rel="stylesheet" href="style.css"><script defer src="portfolio.js"></script><script defer src="app.js"></script></head><body>
<header><div class="wrap bar"><a class="brand" href="#"><b>✦</b> Maker Portfolio</a><button id="profile" class="outline" hidden>✎ แก้ไขหน้าปก</button></div></header>
<main class="wrap"><section class="hero"><div class="intro"><span class="eyebrow">✦ &nbsp; STUDENT PORTFOLIO</span><h1>แฟ้มสะสม<br>ผลงานนักเรียน</h1><p id="student">ชื่อนักเรียน</p><a class="lime" href="#works">สำรวจผลงาน ↓</a></div><div class="cover" id="cover" role="img" aria-label="ภาพปกแฟ้มสะสมผลงาน"></div></section>
<aside id="publish-panel" hidden><p>หน้าจัดการ · ดาวน์โหลดไฟล์ข้อมูลหลังแก้ไข แล้วอัปโหลดแทนไฟล์ portfolio.js บน GitHub</p><button class="dark" id="export">ดาวน์โหลด portfolio.js</button></aside><section id="works"><div class="section-head"><div><h2>คลังผลงาน</h2><p>เลือกหมวดเพื่อดูชิ้นงาน</p></div><button class="dark" id="add" hidden>＋ เพิ่มผลงาน</button></div><div id="categories" class="categories" aria-label="หมวดผลงาน"></div><div class="gallery-head"><h3 id="category-title"></h3><span id="count"></span></div><div class="gallery" id="gallery"></div></section></main>
<footer class="wrap"><span>✦ Maker Portfolio</span><a href="#">กลับขึ้นด้านบน ↑</a></footer>
<dialog id="editor"><form id="edit-form"><div class="dialog-head"><h2 id="edit-title"></h2><button type="button" class="close" aria-label="ปิด">×</button></div><div id="fields"></div><small class="save-note">บันทึกเป็นฉบับร่างในเบราว์เซอร์นี้</small><p id="error" role="alert"></p><div class="actions"><button type="button" id="remove" class="outline" hidden>ลบผลงาน</button><button class="dark" type="submit">บันทึก</button></div></form></dialog>
<dialog id="detail"><div class="dialog-head"><h2 id="detail-title"></h2><button type="button" class="close" aria-label="ปิด">×</button></div><img id="detail-image" alt=""><p id="detail-desc"></p></dialog>
</body></html>
